<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>提示词收纳箱 · 微信风格</title>
  <meta name="description" content="仿微信界面的提示词收纳站：消息可点击放大查看，支持置顶、收藏、收藏两天与三天。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2307c160'/%3E%3Cpath d='M8 11h16v11H13l-5 4z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="app" id="app">

  <!-- ============ 左侧会话栏 ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="side-top">
      <div class="search">
        <svg viewBox="0 0 24 24" class="ico"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
        <input type="search" id="searchInput" placeholder="搜索提示词…" autocomplete="off">
      </div>
      <nav class="side-nav" id="sideNav">
        <button class="nav-item active" data-view="chat"><svg viewBox="0 0 24 24" class="ico"><path d="M4 5h16v11H9l-5 4z"/></svg><span>聊天</span></button>
        <button class="nav-item" data-view="pinned"><svg viewBox="0 0 24 24" class="ico"><path d="M9 3h6l-1 6 4 4H6l4-4z"/><path d="M12 13v8"/></svg><span>置顶</span><i class="badge" id="badgePinned">0</i></button>
        <button class="nav-item" data-view="fav"><svg viewBox="0 0 24 24" class="ico"><path d="M12 3.6l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/></svg><span>收藏</span><i class="badge" id="badgeFav">0</i></button>
      </nav>
    </div>

    <div class="side-scroll">
      <div class="side-group" id="sessionList"></div>
      <div class="side-empty" id="sessionEmpty" hidden>暂无会话</div>
    </div>

    <div class="side-foot">
      <div class="avatar me">我</div>
      <div class="me-info">
        <div class="me-name">我的提示词</div>
        <div class="me-sub" id="statLine">0 条消息</div>
      </div>
      <button class="icon-btn" id="btnMenu" title="更多">
        <svg viewBox="0 0 24 24" class="ico"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
      </button>
    </div>
  </aside>

  <!-- ============ 右侧聊天区 ============ -->
  <main class="chat">
    <header class="chat-head">
      <button class="icon-btn only-mobile" id="btnBack" title="返回">
        <svg viewBox="0 0 24 24" class="ico"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="chat-title">
        <div class="t-name" id="chatTitle">提示词速记</div>
        <div class="t-sub" id="chatSub">0 条消息</div>
      </div>
      <div class="head-tools">
        <button class="icon-btn" id="btnSearch2" title="搜索"><svg viewBox="0 0 24 24" class="ico"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg></button>
        <button class="icon-btn" id="btnExport" title="导出备份"><svg viewBox="0 0 24 24" class="ico"><path d="M12 3v11m0 0l-4-4m4 4l4-4M4 17v3h16v-3"/></svg></button>
        <button class="icon-btn" id="btnImport" title="导入备份"><svg viewBox="0 0 24 24" class="ico"><path d="M12 14V3m0 0L8 7m4-4l4 4M4 17v3h16v-3"/></svg></button>
        <input type="file" id="fileImport" accept="application/json,.json" hidden>
      </div>
    </header>

    <div class="pin-bar" id="pinBar" hidden></div>

    <div class="msg-scroll" id="msgScroll">
      <div id="msgList"></div>
      <div class="scroll-empty" id="msgEmpty" hidden>
        <div class="se-ico">📭</div>
        <p>这里还没有提示词</p>
        <small>在下方输入框写下你的第一条提示词</small>
      </div>
    </div>

    <div class="composer">
      <div class="comp-tools">
        <button class="chip" id="btnNewSession" title="新建会话">＋ 新会话</button>
        <button class="chip" id="btnRenameSession" title="重命名当前会话">✎ 重命名</button>
        <button class="chip danger" id="btnDeleteSession" title="删除当前会话">🗑 删除会话</button>
        <span class="comp-hint" id="compHint"></span>
      </div>
      <div class="comp-body">
        <textarea id="composerInput" rows="2" placeholder="输入提示词，Enter 发送 · Shift+Enter 换行"></textarea>
        <button class="send-btn" id="btnSend" title="发送">发送</button>
      </div>
    </div>
  </main>
</div>

<!-- ============ 消息放大层 ============ -->
<div class="lightbox" id="lightbox" hidden>
  <div class="lb-mask" id="lbMask"></div>
  <div class="lb-card" role="dialog" aria-modal="true" aria-label="消息详情">
    <header class="lb-head">
      <div>
        <div class="lb-title" id="lbTitle">消息详情</div>
        <div class="lb-meta" id="lbMeta"></div>
      </div>
      <button class="icon-btn" id="lbClose" title="关闭"><svg viewBox="0 0 24 24" class="ico"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </header>
    <div class="lb-body" id="lbBody"></div>
    <footer class="lb-foot">
      <div class="lb-actions">
        <button class="act" data-act="pin"><span>📌</span>置顶</button>
        <button class="act" data-act="fav"><span>⭐</span>收藏</button>
        <button class="act" data-act="fav2"><span>⏳</span>收藏两天</button>
        <button class="act" data-act="fav3"><span>🗓</span>收藏三天</button>
        <button class="act" data-act="copy"><span>📋</span>复制</button>
        <button class="act" data-act="edit"><span>✎</span>编辑</button>
        <button class="act danger" data-act="del"><span>🗑</span>删除</button>
      </div>
      <div class="lb-edit" id="lbEdit" hidden>
        <input type="text" id="lbEditTitle" placeholder="标题（可留空）">
        <textarea id="lbEditBody" rows="8" placeholder="提示词内容"></textarea>
        <div class="lb-edit-btns">
          <button class="btn ghost" id="lbEditCancel">取消</button>
          <button class="btn solid" id="lbEditSave">保存</button>
        </div>
      </div>
    </footer>
  </div>
</div>

<!-- ============ 右键菜单 ============ -->
<div class="ctxmenu" id="ctxmenu" hidden></div>

<!-- ============ 提示条 ============ -->
<div class="toast" id="toast" hidden></div>

<script src="data/seed-prompts.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
